# Secretos: llegan por variables de entorno o, en desarrollo, por config/local-secrets.properties (gitignored).
spring.config.import=optional:file:./config/local-secrets.properties

server.port=8083
# MySQL datasource (Docker compose: mysql:5.7 on localhost:3306)
spring.datasource.url=jdbc:mysql://localhost:3306/storeweb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
# JPA: Hibernate crea y actualiza el esquema desde las entidades (incluidas las de solo esquema en
# */infrastructure/outbound/persistence/schema). 'update' crea tablas, columnas, índices y llaves que falten, pero
# no cambia columnas existentes ni CHECK: un cambio así en una base que ya existe se hace a mano (ver db/README.md).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Únicos: crearlos si faltan sin borrar y recrear los existentes en cada arranque.
spring.jpa.properties.hibernate.schema_update.unique_constraint_strategy=RECREATE_QUIETLY
# Datos de referencia (data.sql, idempotente) después de que Hibernate cree las tablas.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
# Flyway apagado: el esquema lo define JPA. db/migration queda como historial de datos (solo INSERT y UPDATE).
spring.flyway.enabled=false
# Lo que Hibernate no crea (llaves foráneas hacia borrado lógico y entre módulos, CHECK nuevas o ampliadas en tablas
# existentes, columnas que pasan a NULL) lo completa SchemaFinisher al arrancar (config/schema). Con ddl-auto=update
# lo aplica; con validate solo lo informa.
#essenza.schema.finisher.mode=report
# JWT: usa un secreto de 32+ bytes
security.jwt.secret=${JWT_SECRET}
# GraphQL
#spring.graphql.path=/graphql
# Habilitar la consola GraphiQL integrada
#spring.graphql.graphiql.enabled=true
# Usar CDN para assets de GraphiQL y evitar issues con webjars
#spring.graphql.graphiql.cdn.enabled=false
# CORS básico para GraphQL (ajusta orígenes según tu frontend)
#spring.graphql.cors.allowed-origins=*
#spring.graphql.cors.allowed-methods=GET,POST,OPTIONS
#spring.graphql.cors.allowed-headers=*
spring.docker.compose.enabled=false
# Logging detallado para diagnosticar GraphQL fuera del perfil dev
#logging.level.org.springframework.graphql=DEBUG
logging.level.com.essenza.tienda=DEBUG
spring.jackson.property-naming-strategy=SNAKE_CASE
# Swagger en snake_case: lo aplica el bean ModelResolver de config/OpenApiConfig (springdoc no tiene propiedad para esto)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=ERROR

# Fase 5 · Reservas de stock de órdenes pendientes: caducan pasado este plazo (ISO-8601) y se revisan cada intervalo.
essenza.orders.reservation-ttl=PT24H
essenza.orders.expiry-check-interval=PT15M

# --- Validacion de tokens de access_control (essenza-security, Fase 4) ---
essenza.security.issuer=${ACCESS_CONTROL_OAUTH2_ISSUER:http://localhost:8000}
essenza.security.jwks-uri=${ACCESS_CONTROL_JWKS_URI:}
# Codigos de las aplicaciones (access_control > Applications, en minusculas, sin tildes, con guiones)
# cuyos tokens acepta este servicio.
essenza.security.audiences=${DRACO_OAUTH2_AUDIENCES:essenza}
essenza.security.accept-legacy=${DRACO_ACCEPT_LEGACY_TOKENS:true}
essenza.security.legacy-secret=${JWT_SECRET:}
essenza.security.legacy-issuer=access-control-service
# Modo observacion hasta conocer los clientes: false = no bloquea, solo registra rutas sin token.
essenza.security.enforce-authentication=${DRACO_ENFORCE_AUTH:false}
# Rutas publicas (patrones Ant, separados por coma). Completar tras revisar el log del modo observacion.
essenza.security.rutas-publicas=${DRACO_RUTAS_PUBLICAS:}
# Propuesta inicial (lectura de la vitrina de la tienda). Confirmar con el log del modo observacion.
essenza.security.rutas-publicas-get=${DRACO_RUTAS_PUBLICAS_GET:/api/shop/catalog/**,/api/shop/product_details/**,/api/shop/reviews/**,/api/shop/recommendations/**,/api/shop/cms/**}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# --- Pagos (medios físicos y virtuales) ---
# URL pública del backend: se usa para los webhooks y el simulador de pagos.
essenza.payments.public-base-url=${PAYMENTS_PUBLIC_BASE_URL:http://localhost:8083}
# A dónde vuelve el cliente al terminar un pago en línea (tienda).
essenza.payments.default-return-url=${PAYMENTS_RETURN_URL:http://localhost:3000/checkout/resultado}
# Simulador de pasarela (solo pruebas): desactivar en producción.
essenza.payments.sandbox.enabled=${PAYMENTS_SANDBOX_ENABLED:true}
essenza.payments.sandbox.secret=${PAYMENTS_SANDBOX_SECRET:essenza-sandbox}
# Wompi: llaves del panel de comercios (pub_test_/prv_test_ = sandbox). Webhook: <public-base-url>/api/shop/sales/payments/webhooks/wompi
essenza.payments.wompi.public-key=${WOMPI_PUBLIC_KEY:}
essenza.payments.wompi.private-key=${WOMPI_PRIVATE_KEY:}
essenza.payments.wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
essenza.payments.wompi.events-secret=${WOMPI_EVENTS_SECRET:}
# Mercado Pago: access token (TEST-… = pruebas) y clave secreta de webhooks. Webhook: <public-base-url>/api/shop/sales/payments/webhooks/mercado_pago
essenza.payments.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
essenza.payments.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}

# Facturación electrónica (V9). Proveedor por defecto: simulador (ACCEPT | REJECT | OFFLINE para pruebas).
essenza.billing.simulator.enabled=${BILLING_SIMULATOR_ENABLED:true}
essenza.billing.simulator.mode=${BILLING_SIMULATOR_MODE:ACCEPT}

# --- Registro central de personas (access_control) ---
# Las ordenes cargan el cliente por numero de documento (GET /api/access_control/persons/lookup)
# con un token de servicio client_credentials (scope persons.read). Sin secreto: deshabilitado.
essenza.access-control.base-url=${ACCESS_CONTROL_URL:http://localhost:8000}
essenza.access-control.token-url=${ACCESS_CONTROL_TOKEN_URL:}
essenza.access-control.client-id=${ESSENZA_TIENDA_SERVICE_CLIENT_ID:essenza-tienda-service}
essenza.access-control.client-secret=${ESSENZA_TIENDA_SERVICE_CLIENT_SECRET:}

# --- Marketplace: vendedores y planes comerciales ---
# Documentos de vendedores hasta 10 MB (PDF, PNG, JPG).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Zona para vigencias y ciclos.
essenza.marketplace.zone=${MARKETPLACE_ZONE:America/Bogota}
# Carpeta PRIVADA de documentos (fuera de cualquier ruta servida por la web).
essenza.marketplace.documents-dir=${MARKETPLACE_DOCUMENTS_DIR:${user.home}/.essenza/draco/seller-documents}
# Solo desarrollo local sin login: empresa con la que actúan las peticiones SIN token.
# Se ignora si DRACO_ENFORCE_AUTH=true. Dejar vacío fuera de tu equipo.
essenza.marketplace.dev-company-id=${MARKETPLACE_DEV_COMPANY_ID:}
# Ofertas (fase 2): moneda del precio de catalogo y control de cuatro ojos en la moderacion.
essenza.marketplace.catalog-currency=${MARKETPLACE_CATALOG_CURRENCY:COP}
essenza.marketplace.offers.four-eyes=${MARKETPLACE_OFFERS_FOUR_EYES:false}
# Comisiones (fase 4): devengo diario de las comisiones exigibles (solo asienta, no cobra).
essenza.marketplace.billing.accrual-cron=${MARKETPLACE_ACCRUAL_CRON:0 20 2 * * *}
# Autorizacion configurable de marketplace, compras y clientes. Sin regla, cualquier usuario
# del contexto Essenza puede la accion. Valores: * | none | perm:NOMBRE | role:NOMBRE (varios con coma).
# Acciones: VENDEDORES.VER/GESTIONAR/APROBAR, PLANES.VER/GESTIONAR/ASIGNAR/EXCEPCIONES,
# OFERTAS.VER/GESTIONAR/MODERAR, COMISIONES.VER/GESTIONAR/AJUSTAR, VENTAS.VER/GESTIONAR. Ejemplos:
#essenza.authorization.rules[VENDEDORES.APROBAR]=role:ADMIN_TIENDA
#essenza.authorization.rules[COMISIONES.AJUSTAR]=role:GERENTE, perm:FINANZAS.AJUSTES
# Proteccion de ordenes, pagos, caja, devoluciones y facturacion (aunque el resto siga en observacion):
# sesion valida de Essenza + accion de la ruta (VENTAS, CAJA, POSTVENTA, FACTURACION .VER/.GESTIONAR).
essenza.authorization.protect-operations=${DRACO_PROTECT_OPERATIONS:true}
# Empresa duena de las ordenes (id_company en access_control). Vacio = no se verifica la empresa del token.
essenza.store.company-id=${ESSENZA_TIENDA_COMPANY_ID:}

# Despachos: días hábiles de alistamiento de las órdenes propias (los subpedidos externos usan los de la oferta)
essenza.orders.handling-days=${ESSENZA_ORDERS_HANDLING_DAYS:1}

# Centro de operaciones: umbrales (días)
essenza.operations.consignment-aged-days=${ESSENZA_OPS_CONSIGNMENT_AGED_DAYS:90}
essenza.operations.returns-stalled-days=${ESSENZA_OPS_RETURNS_STALLED_DAYS:5}
essenza.operations.invoices-pending-days=${ESSENZA_OPS_INVOICES_PENDING_DAYS:1}

# Reclamos: días que tiene el vendedor para responder
essenza.marketplace.disputes.response-days=${ESSENZA_DISPUTES_RESPONSE_DAYS:3}

# Marketplace: quién cobra los subpedidos de vendedores externos (V28).
#   STORE  = la tienda cobra (en línea o en caja) y le liquida al vendedor desde su estado de cuenta.
#   SELLER = el comprador le paga al vendedor por fuera; aquí solo se registra el pago confirmado.
essenza.marketplace.collection=${MARKETPLACE_COLLECTION:STORE}
# Wompi: las llaves de producción (pub_prod_) solo se usan si esto es true (evita cobros reales por error).
essenza.payments.wompi.allow-production=${WOMPI_ALLOW_PRODUCTION:false}
# Pagos a vendedores: días que se retiene lo cobrado de una orden después de entregada (devoluciones y reclamos).
essenza.marketplace.payouts.hold-days=${MARKETPLACE_PAYOUT_HOLD_DAYS:7}
# Factura mensual al vendedor por comisiones y cargos (la tienda es mandataria: la venta la factura el vendedor).
# Tarifa de IVA de las comisiones (id de la tabla de impuestos; vacío = tarifa por defecto). Confirmar con el contador.
essenza.marketplace.invoicing.tax-rate-id=${MARKETPLACE_INVOICING_TAX_RATE_ID:}
# Dispersión automática a vendedores: Wompi Pagos a terceros. Llaves SOLO en variables de entorno.
# Arranca en sandbox; otra URL exige WOMPI_PAYOUTS_ALLOW_PRODUCTION=true (dinero real).
# Webhook: <public-base-url>/api/shop/marketplace/payouts/webhooks/wompi (solo dispara la consulta del lote).
essenza.payouts.wompi.api-key=${WOMPI_PAYOUTS_API_KEY:}
essenza.payouts.wompi.principal-id=${WOMPI_PAYOUTS_PRINCIPAL_ID:}
essenza.payouts.wompi.account-id=${WOMPI_PAYOUTS_ACCOUNT_ID:}
essenza.payouts.wompi.base-url=${WOMPI_PAYOUTS_BASE_URL:https://api.sandbox.payouts.wompi.co/v2}
essenza.payouts.wompi.banks-url=${WOMPI_PAYOUTS_BANKS_URL:}
essenza.payouts.wompi.allow-production=${WOMPI_PAYOUTS_ALLOW_PRODUCTION:false}
# Solo sandbox: APPROVED o FAILED para simular el resultado (vacío = lo decide Wompi).
essenza.payouts.wompi.sandbox-status=${WOMPI_PAYOUTS_SANDBOX_STATUS:}
essenza.payouts.wompi.payment-type=PROVIDERS
essenza.payouts.sync-cron=${PAYOUTS_SYNC_CRON:0 */10 * * * *}
# Tienda pública (essenza-cliente-tienda): API /storefront sin sesión, comprador invitado. Apagada por defecto.
# Agregar /storefront/** a DRACO_RUTAS_PUBLICAS. La empresa la fija el servidor, nunca el navegador.
essenza.storefront.enabled=${STOREFRONT_ENABLED:false}
essenza.storefront.company-id=${STOREFRONT_COMPANY_ID:}
essenza.storefront.store-name=${STOREFRONT_STORE_NAME:Essenza}
# A dónde vuelve el comprador al pagar ({token} = enlace privado del pedido). Sin esto la tienda no se habilita.
essenza.storefront.return-url=${STOREFRONT_RETURN_URL:http://localhost:3000/es/pedido/{token}}
essenza.storefront.shipping-amount=${STOREFRONT_SHIPPING_AMOUNT:0}
# Límite de compras por IP del comprador. La IP llega en X-Forwarded-For desde el servidor de la tienda:
# confiar en ella solo si /storefront no se publica directamente a internet (o el proxy la reescribe).
essenza.storefront.checkouts-per-hour=${STOREFRONT_CHECKOUTS_PER_HOUR:10}
essenza.storefront.trust-forwarded-for=${STOREFRONT_TRUST_FORWARDED_FOR:true}
