spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tienda?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: tienda
    password: ${DB_PASSWORD}
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  # Producción: Hibernate solo valida que el esquema coincida con las entidades. Las tablas se crean con el script
  # que genera el perfil 'schema' (ver db/README.md), revisado y aplicado a mano. data.sql carga lo que falte.
  sql:
    init:
      mode: always
      encoding: UTF-8
  flyway:
    enabled: false
  cache:
    type: caffeine
    cache-names: products, users, warehouses
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,threaddump
  endpoint:
    health:
      show-details: when_authorized
logging:
  level:
    root: INFO
    com.essenza.tienda: INFO
